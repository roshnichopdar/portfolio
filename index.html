<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roshni Chopdar · Marketer, Strategist, Operator</title>
  <meta name="description" content="Portfolio of Roshni Chopdar, a marketing strategist working at the intersection of culture, beauty, creator economy, and AI-powered workflows.">

  <!-- FONTS (Google Fonts, matching the families used in styles.css) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=DM+Sans:wght@300;400;500;600&family=Fraunces:wght@400;500&family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&family=IBM+Plex+Mono:wght@400;500&family=Instrument+Serif:ital,wght@0,400;1,400&family=Manrope:wght@300;400;500;600&display=swap" rel="stylesheet">

  <!-- Site styles -->
  <link rel="stylesheet" href="styles.css">

  <!-- Pre-paint theme: applies the default theme to <html> BEFORE React
       mounts, so the page paints dark from the very first frame — no flash.
       Keep in sync with TWEAK_DEFAULTS in app.jsx. -->
  <script>
    (function () {
      var defaults = { palette: 'blush-ink', type: 'instrument-geist', dark: true };
      var root = document.documentElement;
      root.setAttribute('data-theme', defaults.dark ? 'dark' : 'light');
      if (defaults.palette && defaults.palette !== 'blush-ink') {
        root.setAttribute('data-palette', defaults.palette);
      }
      if (defaults.type && defaults.type !== 'instrument-geist') {
        root.setAttribute('data-type', defaults.type);
      }
    })();
  </script>

  <!-- React + Babel (production builds via CDN) -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7/babel.min.js" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <!-- Component files. Each defines components and exposes them via window
       so the files that load after it can use them. Order matters. -->
  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="components.jsx"></script>
  <script type="text/babel" src="Hero.jsx"></script>
  <script type="text/babel" src="Impact.jsx"></script>
  <script type="text/babel" src="About.jsx"></script>
  <script type="text/babel" src="Experience.jsx"></script>
  <script type="text/babel" src="Projects.jsx"></script>
  <script type="text/babel" src="AIWorkflow.jsx"></script>
  <script type="text/babel" src="Industries.jsx"></script>
  <script type="text/babel" src="Resume.jsx"></script>
  <script type="text/babel" src="Contact.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>
</body>
</html>
