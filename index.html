-->
<html lang="en">

  <!-- FONTS -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />

  <!-- Pre-paint theme: read default theme from the EDITMODE block in app.jsx
       and apply it to <html> BEFORE React mounts, so the page paints dark
       (or light, palette, type) from the very first frame — no flash. -->
  <script>
    (function () {
      // Default matches TWEAK_DEFAULTS in app.jsx — keep in sync.
      var defaults = { palette: 'blush-ink', type: 'instrument-geist', dark: true };
      var root = document.documentElement;
      root.setAttribute('data-theme', defaults.dark ? 'dark' : 'light');
      if (defaults.palette && defaults.palette !== 'blush-ink') {
        root.setAttribute('data-palette', defaults.palette);
      }
      if (defaults.type && defaults.type !== 'instrument-geist') {
        root.setAttribute('data-type', defaults.type);
      }
    })();
  </script>

  <!-- React + Babel -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
